[project]
name = "tools-homeassistant"
version = "0.0.0"
description = "Explicitly scoped Home Assistant tools for Harness"
requires-python = ">=3.11"
dependencies = ["core", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.uv.sources]
core = { workspace = true }
