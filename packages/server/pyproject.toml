[project]
name = "harness-server"
version = "0.0.0"
description = "Authenticated Harness run, session, batch and MCP service."
requires-python = ">=3.11"
dependencies = [
    "core",
    "storage-sqlite",
    "starlette>=0.49,<2",
    "uvicorn>=0.31,<1",
    "aiosqlite>=0.20",
    "mcp==1.30.0",
    "a2a-sdk[http-server]==1.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.uv.sources]
core = { workspace = true }
storage-sqlite = { workspace = true }
