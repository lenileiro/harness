[project]
name = "tools-browser"
version = "0.0.0"
description = "Owned browser automation tools for Harness."
requires-python = ">=3.11"
dependencies = ["core", "pydantic>=2.9", "playwright>=1.51,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.uv.sources]
core = { workspace = true }
