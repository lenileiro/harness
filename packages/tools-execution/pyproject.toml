[project]
name = "tools-execution"
version = "0.0.0"
description = "Managed local, Docker and SSH execution tools for Harness."
requires-python = ">=3.11"
dependencies = ["core", "pydantic>=2.9"]

[project.optional-dependencies]
modal = ["modal>=1.5,<2"]
daytona = ["daytona>=0.211,<1"]
vercel = ["vercel>=0.10,<0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.uv.sources]
core = { workspace = true }
