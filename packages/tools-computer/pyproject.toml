[project]
name = "tools-computer"
version = "0.0.0"
description = "Explicit local desktop control for Harness."
requires-python = ">=3.11"
dependencies = ["core", "pydantic>=2.9", "filelock>=3.18"]

[project.optional-dependencies]
desktop = ["pyautogui>=0.9.54,<1", "Pillow>=10,<13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.uv.sources]
core = { workspace = true }
